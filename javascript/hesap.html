<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3 id="baslik">hesap makinesi</h3>
    <p
      style="
        font-size: 13px;
        color: #555;
        text-align: center;
        font-family: sans-serif;
        margin-bottom: 10px;
      "
    >
      ⚠️ <strong>Not:</strong> Bu hesap makinesi şu an sadece
      <b>tek işlem</b> (Örn: 12+5) ve <b>pozitif sayılarla</b> çalışmaktadır.
      Lütfen negatif sayı veya zincirleme işlem (12+5+2) girmeyiniz.
    </p>

    <div class="calculator" style="border: 2px solid black">
      <input
        type="text"
        id="ekran"
        class="calculator-input"
        value=""
        readonly
        style="width: 100%"
      />

      <div
        class="calculator-keys"
        onclick="myFunction(event)"
        style="
          display: grid;
          grid-template-columns: repeat(4, 25%);
          margin: 1px;
          gap: 1px;
        "
      >
        <button type="button" class="operator" value="+">+</button>
        <button type="button" class="operator" value="-">-</button>
        <button type="button" class="operator" value="*">*</button>
        <button type="button" class="operator" value="/">/</button>

        <button type="button" value="7">7</button>
        <button type="button" value="8">8</button>
        <button type="button" value="9">9</button>
        <button type="button" class="operator" value="%">%</button>

        <button type="button" value="4">4</button>
        <button type="button" value="5">5</button>
        <button type="button" value="6">6</button>
        <button type="button" class="operator" value="^">^</button>

        <button type="button" value="1">1</button>
        <button type="button" value="2">2</button>
        <button type="button" value="3">3</button>
        <button type="button" value="0">0</button>
      </div>
      <div
        style="
          display: flex;
          justify-content: space-between;
          margin-top: 3px;
          margin-bottom: 2px;
        "
      >
        <button
          type="button"
          id="hesapla"
          style="width: 49.8%"
          class="btn1"
          onclick="hesapla()"
        >
          hesapla
        </button>
        <button
          type="button"
          id="reset"
          class="btn2"
          style="width: 49.8%"
          onclick="sil()"
        >
          reset
        </button>
      </div>
    </div>

    <script>
      // let sonuc=document.getElementById("baslik")
      // let  abc=  document.querySelector("calculator-input")
      // console.log(abc)
      // console.log(sonuc)
      // console.log(abc)

      let ekran = document.querySelector(".calculator-input");
      // let hesapla = document.querySelector("#hesapla"); // Buna gerek kalmadı fonksiyondan çağırıyoruz
      // let reset = document.querySelector("#reset");     // Buna gerek kalmadı fonksiyondan çağırıyoruz

      function myFunction(event) {
        // Tıklanan şey bir buton mu kontrol et
        if (!event.target.matches("button")) return;

        // Tıklanan butonun value değerini al
        let deger = event.target.value;

        // Ekrana yazdır
        ekran.value += deger;
      }
      let btn11 = document.querySelector(".btn1");

      btn11.addEventListener("click", () => {
        btn11.style.backgroundColor = "green";
      });

      let btn22=document.querySelector(".btn2");

      btn22.addEventListener("click",()=>{


        btn22.style.backgroundColor="red";
        
      });

      function sil() {
        // ekran.value="";   ilkek yöntem

        // 1. Ekrandaki yazıyı alıyoruz (Örn: "123")
        let mevcutDeger = ekran.value;

        // 2. slice(0, -1) ile son karakteri (3) uçuruyoruz
        let yeniDeger = mevcutDeger.slice(0, -1);

        // 3. Kalanı ("12") ekrana geri yazıyoruz
        ekran.value = yeniDeger;
      }

      // Eval kullanmadan metni parçalayıp hesaplayan fonksiyon
      function hesapla() {
        let metin = ekran.value;
        let ayrac = "";

        // Metnin içindeki operatörü tespit ediyoruz
        if (metin.includes("+")) ayrac = "+";
        else if (metin.includes("-")) ayrac = "-";
        else if (metin.includes("*")) ayrac = "*";
        else if (metin.includes("/")) ayrac = "/";
        else if (metin.includes("%")) ayrac = "%";
        else if (metin.includes("^")) ayrac = "^";

        // Eğer operatör yoksa veya ekran boşsa işlem yapma
        if (ayrac === "") return;

        // Metni operatörden ikiye bölüyoruz
        let parcalar = metin.split(ayrac);

        // Parçaları sayıya çeviriyoruz
        let s1 = parseFloat(parcalar[0]);
        let s2 = parseFloat(parcalar[1]);
        let sonuc = 0;

        // Matematiksel mantığı kuruyoruz
        switch (ayrac) {
          case "+":
            sonuc = s1 + s2;
            break;
          case "-":
            sonuc = s1 - s2;
            break;
          case "*":
            sonuc = s1 * s2;
            break;
          case "/":
            sonuc = s1 / s2;
            break;
          case "%":
            sonuc = s1 % s2;
            break;
          case "^":
            sonuc = Math.pow(s1, s2);
            break;
        }

        // Sonucu ekrana yazdırıyoruz
        ekran.value = sonuc;
      }
    </script>
  </body>
</html>

<!-- responsive hali -->
