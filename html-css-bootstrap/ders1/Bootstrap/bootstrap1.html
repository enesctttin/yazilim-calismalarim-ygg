<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout ve Grid Yapısı</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

</head>

<body>
    <!-- Layout ve Grid Yapısı -->
    <div class="container bg-warning">
        <h1>Enes</h1>
    </div> <!-- div.container yazınca bunu açabiliyoruz  
    Bootstrap’ta containers, içerikleri sarmalamak, boşluk eklemek ve gerektiğinde ortalamak için kullanılan temel yapı taşlarıdır. 
-->
    <br>
    <div class="container-fuild bg-warning">
        <h1>Enes</h1>
    </div>
    <!-- grid ızgara teli gibi  bir satırı bölmeye yarar  bootstrapte bir satır 12 parçadan oluşur col yanına birşey yazmazxak 12 den geriye ne kalırsa onu kullanır-->


    <br>
    <!-- bg-warning sarı renk -->
    <div class="container">
        <div class="row bg-warning" style="height: 150px;">
            <div class="col-sm bg-primary text-light" style="height: 50px;">
                One of three columns
            </div>
            <div class="col-2 bg-danger text-light align-self-center">
                One of three columns
            </div>
            <div class="col-6 bg-success align-self-end">
                <!-- align-self-start yaparsan en üstte konumlanır -->
                One of three columns
            </div>
        </div>
    </div>


    <br>
    <hr>
    <br>
    <div class="container">
        <div class="row bg-warning" style="height: 150px; justify-content:space-around;" >
            <!--  end center around -->
            <div class="col-2 bg-primary" style="height: 50px;">
                One of three columns
            </div>
            <div class="col-2 bg-danger " style="height: 50px;">
                One of three columns
            </div>
            <div class="col-2 bg-success " style="height: 50px;">
                <!-- align-self-start yaparsan en üstte konumlanır -->
                One of three columns
            </div>
        </div>
    </div>



    <!-- responsive icin  sm eklenir eğer ekran 576 px den küçük olursa yan yana olanları alt alta alır telefon görünümü 
     class="col-sm        md kullanılırsa 768 ve altına aynı işlemi yapar    farklı cihazlardan giriş yapıldığında işe yarar
           class="col-sm-4 col-md-8 col-lg-6"   bide bu var -->




    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"
        integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+"
        crossorigin="anonymous"></script>

</body>

</html>
