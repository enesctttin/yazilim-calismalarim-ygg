<!DOCTYPE html>

<body>
    <!-- table tablo ,tr (table row) satır oluşturur,td table data veri girmek için sütuna böler , table border etiketi çerceve getirir -->
    <!-- th table header kalınlaştırı-->
    <table border="1">
       <thead>
        
        <tr>
            <th>
                numara
            </th>
            <td>
                not
            </td>

        </tr>
       </thead>
<tbody>

        <tr>
            <td>
                090230740
            </td>
            <td>95

            </td>

        </tr>
        <br>
        <!-- colpan sütunları birleştirir rowspan satırları birleştirir-->
        <table border="2">
            <tr>
                <th colspan="3">
                     Kisisel Bilgiler
                </th>
            </tr>

            <tr>
                <td rowspan="2">
                    soyad
                </td>
                
                <td>cetin</td>
                <td>21</td>
            </tr>

            <tr>
                <td>akyol</td>
                <td>18</td>
            </tr>

</tbody>

        </table>

    </table>
    <br > <br>
    <h1>new</h1>

</body>
