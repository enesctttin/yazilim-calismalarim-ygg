<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ilk tagim</title>
</head>

<body>
    <!-- paragraf element  p    emmet ssayesinde kod yapısı gözükğyor  lorem satırı kapatır -->
    <p> </p>
    <!-- lorem(x)  paragraf elementin kaç kelime olacağını x belirler-->
    <p>Lorem, ipsum dolor.</p>
    <p>Lorem ipsum dolor sit amet consectetur.</p>

    <!-- header etiketi h1 den h6 ya kadar -->
    <h1>Enes</h1> <!-- en büyüğü bu -->
    <h2>Enes</h2>
    <h3>Enes</h3>
    <h4>Enes</h4>
    <h5>Enes</h5>
    <h6>Enes</h6> <!-- en küçüğü bu -->

    <!--    Biçimlendirme etiketleri
                                            Html işaretleme dili        kapatma sırası var ilk açılan en son kapanır 123321 gibi 
    hr 
    br      break den gelir bir satır boşluk bırakır
    strong          yazıyı kalınlaştırır
    b               strongla aynı yazıyı kalınlaştırır
    i               italik yaziya çevirir (eğik)
    mark            markerden gelme yazıyı  boyar

    -->

    <h2>html dersleri</h2>
    <hr> <!-- hr satırın altına çizgi ekler -->
    <p>
        java dersleri</p>
    <br>
    <p> <strong>deneme</strong> <p>
    <strong>p elementi kullanmadan da yazilir </strong>
    <p><i><mark>C # dersleri </mark></i></p>
    
</body>
<body>

    <!-- img resim ekleme (img)-->  <!-- resim ile html dosyası aynı dizinde olmalı (aynı kloserde bulunmalılar)-->
    <img src="" alt="">  <!-- bazı tag ler elemenetler bitmez açılır öyle kalır b strong hr img-->
    <!-- src soucre kaynak eklenecek resim seçilir / ile adresinden çekilir  alt ise resim açılmazsa yerine gösterilecek şey -->
    <img src="/deneme.html/resimler/ari-ile-ilgili-sozler-7128.jpg" alt="ari yok " width="400"
    height="400">  <!-- / konarak adrese gidilir --> <!-- center tag <center></center>  içine img konursa resmi ortalar
    ayrıca center tagı içine yazıda yazılır yazıyı ortalar -->
    
    
</body>

</html>
