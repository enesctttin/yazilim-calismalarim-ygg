<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

        <!-- div etiketi  div kutucuk oluşturur çerceve ekler gibi--> <!-- css kullanmak gerekir onun içinde head kısmına style eklenecek-->
    
        <!-- style içine . class anlamına gelir  # id anlamına gelir--> <!-- . sonrası class isim verdik divozellik özellikleri belirledik-->
    <style>
        .divozellik{        
             width: 100;
             height: 400px;
             background-color:brown ;
        }
        
    </style>

        <!-- . class yerine id # kullanılabilir sadece isim değişikliği olur class yerine id yazılır . yerine # konur-->

</head>
<body>
    <!-- div de özellik kullanmak için class çağırılır yukarıda oluşturduğumuz hangi atla oluşturduysak onu çağırırız-->
    <div class="divozellik">
<h3> Web siteme hos geldin </h3>

    </div>


    <!-- bu div classın özelliklerini taşır-->






</body>
</html>
