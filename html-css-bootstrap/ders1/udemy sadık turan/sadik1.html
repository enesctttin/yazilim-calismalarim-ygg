  <body>
    <!-- Başlıca SEO Meta Etiketleri
     https://www.searchenginejournal.com/important-tags-seo/156440/

Title (Sayfa Başlığı)

<title>SEO için Meta Etiketleri - Rehber</title>


Arama sonuçlarında görünen mavi başlıktır.

50–60 karakter arası olmalı.

İçerikle alakalı ve anahtar kelime odaklı olmalı.

Meta Description (Açıklama)

<meta name="description" content="SEO için meta etiketleri nedir, nasıl kullanılır? Title, description ve önemli meta etiketlerini bu rehberde öğrenin.">


Google snippet’te başlık altında görünür.

150–160 karakter arası olmalı.

Sayfanın içeriğini özetlemeli.

Meta Keywords (Artık Önemsiz)

<meta name="keywords" content="seo, meta etiketleri, title, description">


Eskiden kullanılıyordu ama Google artık dikkate almıyor.

Yine de bazı küçük arama motorları kullanabiliyor.

Viewport (Mobil Uyumluluk İçin)

<meta name="viewport" content="width=device-width, initial-scale=1.0">


Mobil uyumlu tasarım için gerekli.

SEO’da mobil öncelikli indeksleme olduğundan kritik.

Robots (Indexleme Kontrolü)

<meta name="robots" content="index, follow">


Arama motorlarına sayfayı indeksleyip etmeyeceğini belirtir.

Örnek:

noindex, nofollow → İndeksleme ve link takip edilmesin.

index, follow → İndeksleme ve link takibi açılsın.

Charset (Karakter Kodlaması)

<meta charset="UTF-8">


Doğrudan SEO değil ama içerik düzgün görüntülenmezse SEO’ya dolaylı zarar verir.

Open Graph (Sosyal Medya İçin)

<meta property="og:title" content="SEO için Meta Etiketleri - Rehber">
<meta property="og:description" content="SEO'da kullanılan meta etiketlerini öğrenin.">
<meta property="og:image" content="https://site.com/resim.jpg">
<meta property="og:url" content="https://site.com/seo-meta-etiketleri">


Facebook, LinkedIn gibi platformlarda paylaşım görünümünü güzelleştirir.

Twitter Cards (Twitter Paylaşımı İçin)

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SEO için Meta Etiketleri - Rehber">
<meta name="twitter:description" content="SEO'da kullanılan meta etiketlerini öğrenin.">
<meta name="twitter:image" content="https://site.com/resim.jpg">


✅ Özet:
SEO için en kritik meta etiketleri title, description, robots ve viewport. Sosyal medya için Open Graph ve Twitter Cards eklemek faydalı olur. -->





  </body>
</html>
