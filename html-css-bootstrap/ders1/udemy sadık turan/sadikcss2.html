<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .f20 {
        font-size: 20px;
      }
      .f18 {
        font-size: 18px;
      }
      #idessiz {
        background-color: crimson;
      }
      .some {
        color: blueviolet;
      }
    </style>
  </head>
  <body>
    <!-- class .    id # -->

    <h1 class="some">bu mor class istediğin kadar kullan</h1>
    <p id="idessiz">bu kirmizi id essizdir bir defa kullanilir</p>

    <br /><br />
    <hr />
    <!-- browser defaults 
    tarayıcılar  belli css özellikleri vardır ve bunları html dosyasına otamatik uygular 
    -->
    <br /><br />
    <hr />
    <!-- kalıtım inheritance -->
    https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_cascade/Inheritance
    <p>
      CSS'de miras , bir öğedeki bir özellik için hiçbir değer belirtilmediğinde
      ne olacağını kontrol eder.
    </p>
  </body>
</html>
