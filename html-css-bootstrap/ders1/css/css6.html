<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
<style>
        .kutu{
            background-color: aqua;
            height: 250px; width: 400px;
            margin-top: 40px;
            margin-left: 1000px;
        }
    /* margin boşluk ekler divin dışına doğru  */
    /* padding div  in içine doğru boşluk ayarlar */
        .kutu1{

            background-color: rgb(236, 94, 194);
            height: 250px; width:400px;
            padding-top: 60px;

        }

        .p{
            padding-left: 40%;
        }
    
</style>

</head>

<body>
<!-- div dışına border onun dışına margin eklenebilir -->


<h4>iletisim </h4>

<div class="kutu"> 

</div>
<!-- margini p içinden de kullanabiliriz class yukarıda kutup açıyo tek tek tag ların içine giripde yapabiliriz -->
<p style="margin-left: 400px;"> CSS dersleri</p>

<br>
<div class="kutu1">
<h1 style="padding-left: 30px;">Enes Cetin</h1>

</div>

</html>
