<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
/* link :ilk halidir */
a:link{
    color: red;
    text-decoration: none;

}
/* üzerine gelince turuncu olucak */
a:hover{
    color: orange;
}
/* linkin üzerine tıklanıldığında */
a:active{
    color: blue;
background-color: rgb(216, 83, 156);
}
/*site ziyaret edildikten sonra  */
a :visited{
    color: greenyellow;
}

</style>

<!-- liste için açılan style -->
<style>

    .a{

        list-style-type: square;

    }


</style>


</head>
<body>
    <a style="font-size: 50px;" href="https://www.google.com.tr">Google</a>


</body>


<body> <br> <br><hr>
        <!-- html ul ol liste icon css -->
        <ul class="a">
            <li>cay</li>
            <li>su</li>
            <li>soda</li>
        </ul><br>
        <ol type="A">
            <li>cay</li>
            <li>su</li>
            <li>soda</li>
        </ol>




</body>

</html>
