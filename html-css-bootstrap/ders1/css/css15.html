<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yatay menu </title>
    <style>
        ul{
            list-style-type: none;

        }
        ul li{
            padding: 4px;
         background-color: lightblue;

        }
        ul li :hover{
            background-color: greenyellow;
            transition: 0.5s;
        }
        ul li a{
            text-decoration: none;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            display: block; 
            /* inline elementi block yaptık böylece üzerine gelinildiği zaman satırın hepsi renklenecek */
        }

        ul li:nth-child(1){
            background-color: brown;
        }

    </style>

</head>

<body>
    <!-- navigation bar  menü (dikey)  -->
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">News</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">About</a></li>
    </ul>



</body>
    <!-- display inline-block yaparsak yatay menü yapmış oluruz -->
</html>
