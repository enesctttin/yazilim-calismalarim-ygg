<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .button {
        text-decoration: none;
        font-size: 18px;
        margin-left: 9px;
        display: inline-block;
      }

      .bir {
        background-color: red;
        color: white;
        padding: 14px;
      }

      .bir:hover {
        opacity: 0.8;
        background-color: greenyellow;
      }
      .iki {
        color: blue;
        background-color: white;
        border: 1px solid blue;
        border-radius: 12px;
      }
    </style>

    <style>
      ul li {
        display: inline-block;
        list-style-type: none;
      }

      ul li a {
        text-decoration: none;
        color: black;
        font-size: 20px;
        padding: 10px;
      }
      .icon {
        position: absolute;
        right: 20px;
      }

      ul {
        border: 1px solid black;
        padding: 10px;
        background-color: lightsalmon;
        height: 50px;
      }
    </style>

    <!-- iconlar için ilk önce  font awesome intro -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <style>
      .card {
        width: 20%;
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        transition: 0.3s;
      }
    </style>
  </head>

  <body>
    <a href="" class="button bir">buton1</a>

    <a href="" class="button iki">bvvd3s3s</a><br />
    <hr />

    <ul>
      <li><a href="#">ana</a></li>
      <li><a href="#">hakimm</a></li>
      <li><a href="#">proje</a></li>
      <!--  font awesome 4.7  icon aldığımız yer  -->
      <li>
        <a href="#">hobi <i class="fa fa-car" aria-hidden="true"></i> </a>
      </li>
      <li><a href="#" class="icon">icon</a></li>
    </ul>
    <br />
    <hr />

    <div class="card">
      <img src="images/baba.jpg" alt="acilmadi" width="100%" />
      <div>
        <div class="container" style="padding: 10px; text-align: center">
          >
          <h4><b>John Doe</b></h4>
          <p>Architect & Engineer</p>
        </div>
      </div>
    </div>
  </body>
</html>
